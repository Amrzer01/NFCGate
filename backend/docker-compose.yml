version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nfcgate:supersecret@db/nfcgate
      - SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nfcgate
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=nfcgate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfcgate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
